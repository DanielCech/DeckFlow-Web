<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demonstrace vlnění — 3D Model</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #07070f; }
    #container { width: 100vw; height: 100vh; display: block; }
    #loading {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #07070f; transition: opacity 0.8s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 40px; height: 40px; border: 2px solid rgba(255,255,255,0.1); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: rgba(255,255,255,0.4); font-size: 13px; margin-top: 16px; letter-spacing: 2px; text-transform: uppercase; }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <p>Načítání modelu</p>
  </div>

  <nav>
    <a href="index.html" class="logo">Demonstrace vlnění</a>
    <div class="nav-links">
      <a href="gallery.html">Fotogalerie</a>
      <a href="theory.html">Teorie</a>
      <a href="modeling.html">Modelování</a>
    </div>
  </nav>

  <div id="container"></div>

  <div id="info">
    <h1>Demonstrace vlnění</h1>
    <p>Interaktivní 3D model · Táhni myší pro rotaci</p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
