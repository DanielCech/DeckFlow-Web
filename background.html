<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#131313" />
  <title>Background</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--surface);
    }
    .bg-full {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .bg-full .hero__bg,
    .bg-full .hero__beam,
    .bg-full .hero__grain {
      position: absolute;
      inset: 0;
    }
    .bg-full .hero__beam {
      inset: -10% -10% auto -10%;
      height: 120%;
    }
    .bg-full .hero__grain {
      opacity: 0.35;
      mix-blend-mode: overlay;
      background-image:
        radial-gradient(circle at 10% 30%, rgba(255,205,87,0.04) 0 1px, transparent 2px),
        radial-gradient(circle at 80% 70%, rgba(161,206,215,0.05) 0 1px, transparent 2px),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.02) 0 1px, transparent 2px);
      background-size: 360px 360px, 420px 420px, 280px 280px;
    }
  </style>
</head>
<body>
  <div class="bg-full" aria-hidden="true">
    <div class="hero__bg">
      <div class="hero__beam"></div>
      <div class="hero__grain"></div>
    </div>
  </div>
</body>
</html>
